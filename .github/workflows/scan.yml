name: Scan public web
on:
  push:
    branches: [main]
    paths:
      - 'scripts/scan.py'
      - 'tests/**'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * *'
permissions:
  contents: write
concurrency:
  group: web-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Search for impersonation domains
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TRUSTED_DOMAINS: ${{ vars.TRUSTED_DOMAINS }}
        run: python scripts/scan.py
      - name: Commit fresh results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh WEG brand monitoring'
            git pull --rebase origin main
            git push
          fi
